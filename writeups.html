  <style>

      background: #0a0f1c url('https://www.transparenttextures.com/patterns/circuit-board.png');

      scroll-behavior: smooth;
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;

    nav {
      position: fixed;

      width: 100%;

      padding: 15px;
      text-align: center;

    }

    nav a {

      color: #58a6ff;
      text-decoration: none;
      font-weight: bold;

    }

    }

      padding: 120px 20px;

    }

    h1 {
      font-size: 3rem;
      font-family: 'Orbitron', sans-serif;
    }

    h2 {
      margin-bottom: 20px;
      font-family: 'Orbitron', sans-serif;
    }

    p {
      color: #9da5b4;
    }

    .card {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(88,166,255,0.2);
      padding: 20px;
      margin: 25px auto;
      max-width: 400px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #58a6ff;
      box-shadow: 0 0 15px rgba(88,166,255,0.3);
    }

    a.button {
      display: inline-block;
      margin-top: 10px;
      color: #58a6ff;
      text-decoration: none;
      transition: 0.2s;
    }

    a.button:hover {
      color: #38bdf8;
      text-shadow: 0 0 6px rgba(56,189,248,0.8);
    }
  </style>
</head>
